<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3ZFQH3NC6G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-3ZFQH3NC6G');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | MORENITOYICO</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="icon" type="image/png" href="IMG/favicon.png">
</head>
<body>

    <header class="navbar-minimal">
        <div class="logo"><a href="index.html" style="color:#fff; text-decoration:none;">MORENITOYICO</a></div>
        <nav class="nav-links">
            <a href="index.html">← Inicio</a>
            <a href="contact.html">Contacto</a>
        </nav>
    </header>

    <main class="hero-container" style="max-width: 650px;">
        <span class="group-title">Experiencias Exclusivas</span>
        <h1 style="font-size: 1.5rem; font-weight: 400; margin-bottom: 30px;">Agendar Servicio</h1>

        <form id="bookingForm" style="display: flex; flex-direction: column; gap: 25px;">
            
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <label class="group-title">1. Selecciona el servicio</label>
                <select id="service" name="service" required class="minimal-input">
                    <option value="Video Saludo Personalizado - $15.000 CLP">Video Saludo Personalizado — $15.000 CLP</option>
                    <option value="Videollamada 1 a 1 (15 min) - $35.000 CLP">Videollamada 1 a 1 (15 min) — $35.000 CLP</option>
                    <option value="Asesoría / Colaboración - Cotizar">Asesoría / Colaboración — Cotizar</option>
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label class="group-title">2. Tu Nombre</label>
                    <input type="text" id="name" name="name" placeholder="Ej. Juan Pérez" required class="minimal-input">
                </div>
                <div>
                    <label class="group-title">3. Tu WhatsApp</label>
                    <input type="tel" id="phone" name="phone" placeholder="+56 9..." required class="minimal-input">
                </div>
            </div>

            <div>
                <label class="group-title">4. Fecha tentativa sugerida</label>
                <input type="date" id="date" name="date" class="minimal-input" style="color-scheme: dark;">
            </div>

            <div>
                <label class="group-title">5. Detalles o mensaje personalizado</label>
                <textarea id="details" name="details" rows="3" placeholder="¿Para quién es el saludo? ¿Qué te gustaría hablar?" class="minimal-input"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-buy" style="padding: 16px; margin-top: 10px; cursor: pointer;">Enviar Solicitud vía WhatsApp →</button>
        </form>
    </main>

    <script>
        const PHONE_NUMBER = '56949696642';

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const service = document.getElementById('service').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const date = document.getElementById('date').value || 'Sin fecha definida';
            const details = document.getElementById('details').value || 'Sin detalles extra';

            const message = `🚨 *NUEVA RESERVA - MORENITOYICO* 🚨\n\n` +
                            `📌 *Servicio:* ${service}\n` +
                            `👤 *Nombre:* ${name}\n` +
                            `📱 *Contacto:* ${phone}\n` +
                            `📅 *Fecha Tentativa:* ${date}\n` +
                            `📝 *Detalles:* ${details}`;

            window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
        });
    </script>
</body>
</html>
