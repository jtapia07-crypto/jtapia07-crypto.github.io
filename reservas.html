<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | MORENITOYICO</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

    <!-- Navegación Superior con la misma sangría que el index -->
    <header class="navbar" style="padding: 20px 40px;">
        <div class="nav-left">
            <a href="index.html" class="pill-btn">← Volver al Inicio</a>
        </div>
        <div class="logo">MORENITOYICO</div>
        <div class="nav-right">
            <a href="contact.html" class="pill-btn">Contacto</a>
        </div>
    </header>

    <main class="booking-container" style="margin-top: 20px;">
        <div class="section-header">
            <span class="section-subtitle">EXPERIENCIAS EXCLUSIVAS</span>
            <h2>AGENDAR / RESERVAR</h2>
        </div>

        <form class="booking-form">
            <div class="form-group">
                <label for="service">Tipo de Servicio</label>
                <select id="service" name="service" required>
                    <option value="saludo">Video Saludo Personalizado</option>
                    <option value="videollamada">Videollamada 1 a 1 (15 min)</option>
                    <option value="asesoria">Asesoría / Colaboración</option>
                </select>
            </div>

            <div class="form-group">
                <label for="name">Tu Nombre</label>
                <input type="text" id="name" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="details">Detalles de la solicitud</label>
                <textarea id="details" rows="4" placeholder="Indica el motivo del saludo o el tema de la videollamada..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Enviar Solicitud</button>
        </form>
    </main>

</body>
</html>
