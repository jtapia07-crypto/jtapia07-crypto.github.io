<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | MORENITOYICO</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

    <header class="navbar" style="padding: 20px 40px;">
        <div class="nav-left">
            <a href="index.html" class="pill-btn">← Volver al Inicio</a>
        </div>
        <div class="logo">MORENITOYICO</div>
        <div class="nav-right">
            <a href="reservas.html" class="pill-btn">Reservas</a>
        </div>
    </header>

    <main class="booking-container" style="margin-top: 20px;">
        <div class="section-header">
            <span class="section-subtitle">MENSAJE DIRECTO</span>
            <h2>CONTACTO</h2>
        </div>

        <form class="booking-form">
            <div class="form-group">
                <label for="c-name">Nombre</label>
                <input type="text" id="c-name" placeholder="Tu nombre" required>
            </div>

            <div class="form-group">
                <label for="c-email">Correo Electrónico</label>
                <input type="email" id="c-email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="c-message">Mensaje</label>
                <textarea id="c-message" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Enviar Mensaje</button>
        </form>
    </main>

</body>
</html>
